<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="description" content="日历 - 离线可用的渐进式网页应用">
    <title>日历</title>

    <!-- PWA manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- 图标：SVG 用于标签页与 manifest，PNG 用于 iOS 主屏（两者底色故意不同） -->
    <link rel="icon" type="image/svg+xml" href="icons/icon-512x512.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180x180.png">

    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- 阻塞式内联脚本：在浏览器渲染前应用主题，防止闪白/闪黑 -->
    <script>
        (function() {
            var mode = localStorage.getItem('themeMode') || 'auto';
            var isDark = mode === 'dark' || (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
</head>
<body>
    <div id="app">

        <!-- Navigation -->
        <nav class="nav">
            <div class="nav-left">
                <button id="prev-month" class="nav-btn">‹</button>
                <div class="nav-date">
                    <input type="month" id="current-month" class="month-year"
                           min="1900-01"
                           max="2100-12">
                </div>
                <button id="next-month" class="nav-btn">›</button>
            </div>
            <div class="nav-right">
                <button id="today-btn" class="today-btn">今日</button>
                <button id="settings-btn" class="nav-btn" aria-label="设置">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                </button>
            </div>
        </nav>

        <!-- Calendar -->
        <main class="calendar-container">
            <div class="weekdays">
                <div class="weekday">一</div>
                <div class="weekday">二</div>
                <div class="weekday">三</div>
                <div class="weekday">四</div>
                <div class="weekday">五</div>
                <div class="weekday">六</div>
                <div class="weekday">日</div>
            </div>
            <div id="calendar-grid-wrapper" class="calendar-grid-wrapper">
                <div id="calendar-grid" class="calendar-grid">
                    <!-- Calendar days will be generated by JavaScript -->
                </div>
            </div>
        </main>

        <!-- Day Detail Panel (below calendar) -->
        <div id="day-detail" class="day-detail" style="display: none;">
            <div class="detail-header">
                <span id="detail-date" class="detail-date"></span>
            </div>
            <div class="detail-body">
                <!-- 备注：有备注时才显示，放在最前面 -->
                <div id="detail-notes" class="detail-row detail-note-row" style="display: none;">
                    <span class="detail-label">备注</span>
                    <span id="detail-note-value" class="detail-value"></span>
                </div>
                <!-- Row 1: 农历 生肖 年份 -->
                <div class="detail-row">
                    <span class="detail-label">农历</span>
                    <span id="detail-lunar" class="detail-value"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">生肖</span>
                    <span id="detail-zodiac" class="detail-value"></span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">年份</span>
                    <span id="detail-year" class="detail-value"></span>
                </div>
                <!-- Row 2: 黄历宜忌 -->
                <div class="detail-row huangli-row">
                    <span class="huangli-badge yi">宜</span>
                    <div id="detail-yi" class="huangli-list"></div>
                </div>
                <div class="detail-row huangli-row">
                    <span class="huangli-badge ji">忌</span>
                    <div id="detail-ji" class="huangli-list"></div>
                </div>
            </div>
        </div>

        <!-- 设置面板 -->
        <div id="settings-overlay" class="settings-overlay" hidden>
            <div class="settings-sheet" role="dialog" aria-modal="true" aria-label="设置">
                <div class="settings-header">
                    <span class="settings-title">设置</span>
                    <button id="settings-close" class="settings-close" aria-label="关闭">×</button>
                </div>

                <div class="settings-group">
                    <div class="settings-label">主题</div>
                    <div class="settings-theme">
                        <button class="theme-option" data-mode="light">浅色</button>
                        <button class="theme-option" data-mode="dark">深色</button>
                        <button class="theme-option" data-mode="auto">自动</button>
                    </div>
                </div>

                <div class="settings-group">
                    <div class="settings-label">日期备注</div>
                    <p class="settings-hint">先在日历里点选日期，再填写备注。农历支持生日等每年重复的日期。</p>

                    <div class="note-form">
                        <input type="text" id="note-text" class="note-text-input"
                               placeholder="备注内容" maxlength="40" autocomplete="off">

                        <div class="form-row">
                            <span class="form-label">历法</span>
                            <div class="segmented" id="note-calendar">
                                <button type="button" class="seg-option active" data-value="solar">新历</button>
                                <button type="button" class="seg-option" data-value="lunar">农历</button>
                            </div>
                        </div>

                        <div class="form-row">
                            <span class="form-label">重复</span>
                            <div class="segmented" id="note-repeat">
                                <button type="button" class="seg-option active" data-value="none">不重复</button>
                                <button type="button" class="seg-option" data-value="weekly">每周</button>
                                <button type="button" class="seg-option" data-value="monthly">每月</button>
                                <button type="button" class="seg-option" data-value="yearly">每年</button>
                            </div>
                        </div>

                        <div class="form-row" id="note-date-row">
                            <span class="form-label">日期</span>
                            <input type="date" id="note-date" class="form-date-input">
                            <span id="note-solar-hint" class="form-hint"></span>
                        </div>

                        <div class="form-row" id="note-lunar-row" hidden>
                            <span class="form-label">农历</span>
                            <div class="lunar-selects">
                                <select id="note-lunar-month" class="form-select"></select>
                                <select id="note-lunar-day" class="form-select"></select>
                            </div>
                            <span id="note-lunar-hint" class="form-hint"></span>
                        </div>

                        <div class="form-row" id="note-weekday-row" hidden>
                            <span class="form-label">星期</span>
                            <select id="note-weekday" class="form-select"></select>
                        </div>

                        <div class="note-form-actions">
                            <button type="button" id="note-add" class="settings-primary-btn">添加备注</button>
                            <button type="button" id="note-cancel-edit" class="settings-btn" hidden>取消编辑</button>
                        </div>
                    </div>

                    <div id="note-manage-list" class="note-manage-list"></div>
                </div>

                <div class="settings-group">
                    <div class="settings-label">日期备注备份</div>
                    <p class="settings-hint">备注只保存在本机，清理浏览器数据会丢失，建议定期导出到网盘或文件。</p>
                    <div class="settings-actions">
                        <button id="export-notes" class="settings-btn">导出备份</button>
                        <button id="import-notes" class="settings-btn">导入备份</button>
                    </div>
                    <input type="file" id="import-file" accept=".json,application/json" hidden>
                </div>
            </div>
        </div>


    </div>

    <!-- Scripts -->
    <script defer src="js/lunar.js"></script>
    <script defer src="js/calendar.js"></script>
    <script defer src="js/holiday.js"></script>
    <script defer src="js/notes.js"></script>
    <script defer src="js/app.js"></script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
                    .then(registration => {
                        console.log('SW registered: ', registration);
                    })
                    .catch(registrationError => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
    </script>
</body>
</html>
